[project]
name = "rostransnadzor-parser"
version = "1.0.0"
description = "Парсер для автоматического входа в личный кабинет"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.15.0",
    "openpyxl>=3.1.2",
    "opencv-python>=4.8.1.78",
    "numpy>=1.24.3",
    "pyautogui>=0.9.54",
    "mss>=9.0.1",
    "keyboard>=0.13.5",
    "pillow>=10.1.0",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "websockets==12.0",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "pandas==2.1.4",
    "xlrd==2.0.1",
    "xlwt==1.3.0",
    "bcrypt==4.0.1",
    "python-jose[cryptography]==3.3.0",
    "psutil==5.9.6",
    "watchdog==3.0.0",
]

[project.scripts]
rostransnadzor-parser = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"